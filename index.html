<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Sidebar</title>
</head>
<body>
    <header>
        <nav id="sidebar">
            <div id="nav-container">
                <div id="user">
                    <img src="./imagens/personagem1.avif" alt="Avatar">
                    <p id="user-description">
                        <span class="item-descripition">
                            Maicon Oliveira
                        </span>
                        <span class="item-descripition">
                            lorem Pseu
                        </span>
                    </p>
                </div>
                <ul id="navebar-cont">
                    <li class="active">
                        <a href="#">
                            <i class="bi bi-bar-chart-line"></i>
                            <span class="item-descripition">
                                Dashbord
                            </span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="bi bi-people-fill"></i>
                            <span class="item-descripition">
                                Usuarios
                            </span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="bi bi-bell-fill"></i>
                            <span class="item-descripition">
                                Notificações
                            </span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="bi bi-box-seam"></i>
                            <span class="item-descripition">
                                Produtos
                            </span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="bi bi-images"></i>
                            <span class="item-descripition">
                                Imagens
                            </span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="bi bi-gear-fill"></i>
                            <span class="item-descripition">
                                Configurações
                            </span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="bi bi-moon-fill"></i>
                            <span id="mode-btn" class="item-descripition">
                                dark/light
                                <div id="cont-mode">
                                    <div class="botao-mode "></div>
                                </div>
                            </span>
                        </a>
                    </li>
                </ul>
                <button id="btn-open" onclick="abrir()">
                    <i class="bi bi-arrow-right-short"></i>
                </button>
            </div>    
            <button id="btn-out">
                <i class="bi bi-box-arrow-in-left"></i>
                <span class="item-descripition">Log out</span>
            </button>
        </nav>
    </header>
    <main>
        <h1>Main</h1>
    </main>
    <script src="scripts/main.js"></script>
</body>
</html>
